# Loaded inside nginx's http block by sites-enabled.
limit_req_zone $binary_remote_addr zone=notebook_api:10m rate=5r/s;

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    root /var/www/timestamp-notebook;
    index index.html;
    client_max_body_size 16k;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    location /api/ {
        limit_req zone=notebook_api burst=20 nodelay;
        limit_req_status 429;
        # No trailing slash: preserve /api/entries when forwarding.
        proxy_pass http://10.20.2.10:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 12s;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
