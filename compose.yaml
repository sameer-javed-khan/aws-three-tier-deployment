# Optional Mac rehearsal. AWS uses the three EC2 machines and deploy/ scripts.
services:
  database:
    build: ./database
    environment:
      POSTGRES_USER: lab_admin
      POSTGRES_PASSWORD: ${LOCAL_ADMIN_PASSWORD:?Set LOCAL_ADMIN_PASSWORD in .env}
      POSTGRES_DB: notesdb
      APP_DB_PASSWORD: ${LOCAL_APP_PASSWORD:?Set LOCAL_APP_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab_admin -d notesdb"]
      interval: 5s
      timeout: 3s
      retries: 15
  backend:
    build: ./backend
    environment:
      DB_HOST: database
      DB_NAME: notesdb
      DB_USER: record_app
      DB_PASSWORD: ${LOCAL_APP_PASSWORD:?Set LOCAL_APP_PASSWORD in .env}
    depends_on:
      database: { condition: service_healthy }
    networks: [web, data]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 15
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:8080:80"]
    depends_on:
      backend: { condition: service_healthy }
    networks: [web]
volumes:
  pgdata:
networks:
  web:
  data:
    internal: true
